# Posting settings. None of these are secrets (tokens are Actions secrets).
# Instagram is off: add ig_account_id: "<id>" and the IG_ACCESS_TOKEN secret to turn it back on.
clips_repo: notjawad404/content-clipping   # public repo whose Releases host the queued clip files
graph_version: v26.0
queue_branch: master                        # the branch the cron reads; queueing is refused anywhere else
youtube: true                               # also post each clip to YouTube Shorts
youtube_privacy: public                     # YouTube forces private until the API project passes its audit
max_attempts: 3
poll_interval_s: 10
poll_timeout_s: 300
