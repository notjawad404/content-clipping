# Instagram posting settings. None of these are secrets (the token is the IG_ACCESS_TOKEN Actions secret).
clips_repo: hammadalive7/content-clips      # public repo whose Release assets Instagram fetches
ig_account_id: "17841438716134897"          # vanguardvisionhub
graph_version: v26.0
queue_branch: master                        # the branch the cron reads; queueing is refused anywhere else
youtube: true                               # also post each clip to YouTube Shorts
youtube_privacy: private                    # stays private until the YouTube API audit passes; then public
max_attempts: 3
poll_interval_s: 10
poll_timeout_s: 300
