# Posting settings. None of these are secrets (tokens are Actions secrets).
ig_account_id: "17841417816087015"          # notjawad404yt; token is the IG_ACCESS_TOKEN secret
instagram_backlog: [_ImWJKj14X4]            # older videos; post-instagram's noon slot posts one of these a day
clips_repo: notjawad404/content-clipping   # public repo whose Releases host the queued clip files
graph_version: v26.0
queue_branch: master                        # the branch the cron reads; queueing is refused anywhere else
youtube: true                               # also post each clip to YouTube Shorts
youtube_privacy: private                    # set to public once the YouTube API audit passes
tiktok: true
tiktok_mode: direct                          # manual: listed in queue/tiktok.md for TikTok Studio; draft: TikTok
                                            # inbox (mobile app only); direct: posted. draft/direct need TT_* secrets
tiktok_keep_days: 7                         # manual: download links stay up this long
tiktok_privacy: SELF_ONLY                   # direct mode only; unaudited apps can only post privately
max_attempts: 3
poll_interval_s: 10
poll_timeout_s: 300
