[project]
name = "clipper"
version = "0.1.0"
description = "Local podcast clipper driven by Claude Code"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
    "parakeet-mlx>=0.7.0",
    "scenedetect>=0.7.2",
    "opencv-contrib-python>=4.10",
    "mediapipe>=1.2.2",
    "pysubs2>=1.7",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "numpy",
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs ffmpeg-full, network or downloaded models"]
addopts = "-m 'not integration'"
