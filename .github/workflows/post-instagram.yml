name: post-instagram

on:
  schedule:
    - cron: "0 7 * * *"     # 12:00 PM Pakistan time: one clip from instagram_backlog
    - cron: "0 10 * * *"    # 3:00 PM: next new clip
    - cron: "0 13 * * *"    # 6:00 PM: next new clip
    - cron: "0 16 * * *"    # 9:00 PM: next new clip
  workflow_dispatch:
    inputs:
      slot:
        description: "new: next new clip; old: next instagram_backlog clip"
        type: choice
        options: [new, old]
        default: new
      dry_run:
        description: "Check the token and the clip, but do not publish"
        type: boolean
        default: true

concurrency:
  group: ig-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the only dependency (pyyaml)
        run: python -m pip install --quiet pyyaml
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Post one clip to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.CLIPS_REPO_TOKEN || github.token }}
          SLOT: ${{ inputs.slot || (github.event.schedule == '0 7 * * *' && 'old' || 'new') }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m clipper.publish.post_next --instagram "$SLOT" --dry-run
          else
            python -m clipper.publish.post_next --instagram "$SLOT"
          fi
