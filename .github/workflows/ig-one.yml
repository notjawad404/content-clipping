name: ig-one

on:
  workflow_dispatch:
    inputs:
      entry:
        description: "queue/posted entry id to post to Instagram"
        required: true

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Post one entry to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ENTRY: ${{ inputs.entry }}
        run: |
          python - <<'EOF'
          import json, os
          from clipper.publish.config import load_publish_config
          from clipper.publish.instagram import InstagramClient
          cfg = load_publish_config()
          entry = json.load(open(f"queue/posted/{os.environ['ENTRY']}.json", encoding="utf-8"))
          client = InstagramClient(os.environ["IG_ACCESS_TOKEN"], cfg["ig_account_id"], cfg["graph_version"])
          container = client.create_reel_container(entry["asset_url"], entry["caption"])
          client.wait_until_finished(container, cfg["poll_interval_s"], cfg["poll_timeout_s"])
          media = client.publish(container)
          print(f"media_id={media}")
          print(f"permalink={client.permalink(media)}")
          EOF
