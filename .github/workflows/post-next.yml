name: post-next

on:
  schedule:
    - cron: "0 10 * * *"    # 3:00 PM Pakistan time (UTC+5): the day's clips go up private, to be scheduled in YouTube Studio
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check credentials and the next queued clip, but do not publish"
        type: boolean
        default: true
      count:
        description: "How many queued clips to post"
        type: number
        default: 3

concurrency:
  group: ig-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the only dependency (pyyaml)
        run: python -m pip install --quiet pyyaml
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Post the next queued clips (3 a day)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.CLIPS_REPO_TOKEN || github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          COUNT: ${{ inputs.count || 3 }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m clipper.publish.post_next --dry-run
          else
            for i in $(seq 1 "$COUNT"); do
              ls queue/pending/*.json >/dev/null 2>&1 || break
              python -m clipper.publish.post_next
            done
            python -m clipper.publish.post_next --tiktok-drafts
          fi
