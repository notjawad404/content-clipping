name: post-next

on:
  schedule:
    - cron: "37 17 * * *"   # ~12:37 PM ET / 9:37 AM PT (1:37 PM ET in summer)
    - cron: "13 0 * * *"    # ~7:13 PM ET / 4:13 PM PT (8:13 PM ET in summer)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check credentials and the next queued clip, but do not publish"
        type: boolean
        default: true

concurrency:
  group: ig-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the only dependency (pyyaml)
        run: python -m pip install --quiet pyyaml
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Random delay before posting (scheduled runs only)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1200 ))
      - name: Post the next queued clip
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.CLIPS_REPO_TOKEN || github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python -m clipper.publish.post_next --dry-run
          else
            python -m clipper.publish.post_next
          fi
